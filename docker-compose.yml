# Prod-like demo runtime: two containers, one shared volume. Local development uses `npm run dev` instead.
services:
  gateway:
    build:
      context: .
      dockerfile: infra/Dockerfile.gateway
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      APP_DB_PATH: /data/app.db
      ENGINE_URL: http://engine:8000
    volumes:
      - claimshield-data:/data
    depends_on:
      engine:
        condition: service_healthy

  engine:
    build:
      context: .
      dockerfile: infra/Dockerfile.engine
    env_file:
      - .env
    environment:
      APP_DB_PATH: /data/app.db
      DATA_DIR: /data
    volumes:
      - claimshield-data:/data
    healthcheck:
      # the first start generates the synthetic data and the first run, so allow time
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json')"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s
    expose:
      - "8000"          # internal network only; never published to the host

volumes:
  claimshield-data: {}
