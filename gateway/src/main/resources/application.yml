spring:
  application:
    name: claimshield-gateway
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 4MB
  datasource:
    # One SQLite file shared with the Python engine. Python writes serving_*; this app writes wf_*.
    url: jdbc:sqlite:${APP_DB_PATH:../data/app.db}?journal_mode=WAL&busy_timeout=5000&foreign_keys=on
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 4
  sql:
    init:
      mode: always
      schema-locations: classpath:wf_schema.sql
      separator: "^^^"
server:
  port: 8080
  tomcat:
    max-swallow-size: 4MB
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
management:
  endpoints:
    web:
      exposure:
        include: health
claimshield:
  demo-mode: ${DEMO_MODE:true}
  engine:
    url: ${ENGINE_URL:http://127.0.0.1:8000}
    token: ${ENGINE_TOKEN:dev-engine-token}
  llm:
    mode: ${LLM_MODE:template}          # live | template
    model-brief: ${ANTHROPIC_MODEL_BRIEF:claude-sonnet-5-5}
    model-fast: ${ANTHROPIC_MODEL_FAST:claude-haiku-5-5}
    api-key: ${ANTHROPIC_API_KEY:}
    base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
    timeout-seconds: 25
  gemini:
    model: ${GEMINI_MODEL:gemini-3.1-flash-lite}
    key: ${GEMINI_API_KEY:}
    key-2: ${GEMINI_API_KEY_2:}
    key-3: ${GEMINI_API_KEY_3:}
    key-4: ${GEMINI_API_KEY_4:}
    key-5: ${GEMINI_API_KEY_5:}
    key-6: ${GEMINI_API_KEY_6:}
    rpm: ${GEMINI_RPM:0}            # 0 = the model family's free-tier default
    tpm: ${GEMINI_TPM:0}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    timeout-seconds: 40
  sarvam:
    enabled: ${VOICE_ENABLED:false}
    api-key: ${SARVAM_API_KEY:}
    base-url: ${SARVAM_BASE_URL:https://api.sarvam.ai}
